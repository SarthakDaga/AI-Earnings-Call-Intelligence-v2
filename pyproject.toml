[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "venv", "update*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402", "B011", "E702"]
"scripts/*" = ["E402"]
"eval/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
