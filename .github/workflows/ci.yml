name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-dev.txt     # no torch needed: tests use deterministic fakes
      - run: ruff check .
      - run: python -m pytest
      - name: Retrieval regression gate
        run: python -m eval.smoke
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t earnings-ai .
